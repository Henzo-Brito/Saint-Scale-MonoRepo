<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Membros - SaintScale Admin</title>
	<link rel="stylesheet" href="/admin/css/style.css">
</head>
<body>
	<header class="header">
		<div class="header-content">
			<h1>Membros</h1>
			<div class="nav-actions">
				<button class="btn btn-secondary btn-sm" onclick="location.href='/admin/dashboard.html'">Voltar</button>
				<button class="btn btn-primary btn-sm" onclick="openCreateModal()">Novo Membro</button>
				<button class="btn btn-secondary btn-sm" onclick="window.saintScaleAdmin.logout()">Sair</button>
			</div>
		</div>
	</header>

	<div class="container">
		<div id="alert-container"></div>

		<div class="card">
			<div class="card-title">Lista de Membros</div>
			<table class="table">
				<thead>
					<tr>
						<th>Nome</th>
						<th>E-mail</th>
						<th>Cargo</th>
						<th>Status</th>
						<th>Ações</th>
					</tr>
				</thead>
				<tbody id="members-table-body">
					<tr><td colspan="5" class="empty-state">Carregando...</td></tr>
				</tbody>
			</table>
		</div>
	</div>

	<!-- Create/Edit Modal -->
	<div id="member-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000;">
		<div style="background: var(--c6); border-radius: 8px; padding: 24px; max-width: 500px; margin: 60px auto; box-shadow: 0 4px 6px rgba(0,0,0,0.15);">
			<h3 id="modal-title" style="margin-top: 0;">Novo Membro</h3>
			<div id="modal-alert"></div>
			<form id="member-form">
				<input type="hidden" id="member-id">
				<div class="form-group">
					<label>Nome</label>
					<input type="text" id="member-name" required>
				</div>
				<div class="form-group">
					<label>E-mail</label>
					<input type="email" id="member-email" required>
				</div>
				<div class="form-group">
					<label>Cargo</label>
					<select id="member-cargo">
						<option value="Membro">Membro</option>
						<option value="Administrador">Administrador</option>
					</select>
				</div>
				<div class="form-group">
					<label>Status</label>
					<select id="member-status">
						<option value="pendente">Pendente</option>
						<option value="aprovado">Aprovado</option>
					</select>
				</div>
				<div class="form-group">
					<label>Senha</label>
					<input type="password" id="member-password" placeholder="Deixe em branco para manter">
				</div>
				<div style="display: flex; gap: 8px; margin-top: 16px;">
					<button type="button" class="btn btn-secondary" onclick="closeMemberModal()">Cancelar</button>
					<button type="submit" class="btn btn-primary">Salvar</button>
				</div>
			</form>
		</div>
	</div>

	<!-- Membro Vínculos Modal -->
	<div id="member-vinculos-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1001;">
		<div style="background: var(--c6); border-radius: 8px; padding: 24px; max-width: 700px; margin: 60px auto; box-shadow: 0 4px 6px rgba(0,0,0,0.15); max-height: 80vh; overflow-y: auto;">
			<h3 id="member-vinculos-modal-title" style="margin-top: 0;">Vínculos do Membro</h3>
			<div id="member-vinculos-modal-alert"></div>
			
			<div style="margin-bottom: 24px;">
				<h4 style="margin-bottom: 12px;">Equipes</h4>
				<div id="member-equipes-loading" style="text-align: center; padding: 10px;">Carregando...</div>
				<table class="table" id="member-equipes-table" style="display: none;">
					<thead>
						<tr>
							<th>Nome</th>
							<th>Ações</th>
						</tr>
					</thead>
					<tbody id="member-equipes-table-body">
					</tbody>
				</table>
				<div id="member-equipes-empty" style="display: none; text-align: center; padding: 10px; color: var(--c3);">Nenhuma equipe</div>
				<div style="margin-top: 12px;">
					<label>Adicionar à equipe</label>
					<select id="member-equipe-select" class="form-control" style="display: inline-block; width: auto; margin-right: 8px;">
						<option value="">Selecione uma equipe</option>
					</select>
					<button class="btn btn-primary btn-sm" onclick="addMembroAEquipe()">Adicionar</button>
				</div>
			</div>

			<div>
				<h4 style="margin-bottom: 12px;">Ministérios</h4>
				<div id="member-ministerios-loading" style="text-align: center; padding: 10px;">Carregando...</div>
				<table class="table" id="member-ministerios-table" style="display: none;">
					<thead>
						<tr>
							<th>Nome</th>
							<th>Ações</th>
						</tr>
					</thead>
					<tbody id="member-ministerios-table-body">
					</tbody>
				</table>
				<div id="member-ministerios-empty" style="display: none; text-align: center; padding: 10px; color: var(--c3);">Nenhum ministério</div>
				<div style="margin-top: 12px;">
					<label>Adicionar ao ministério</label>
					<select id="member-ministerio-select" class="form-control" style="display: inline-block; width: auto; margin-right: 8px;">
						<option value="">Selecione um ministério</option>
					</select>
					<button class="btn btn-primary btn-sm" onclick="addMembroAoMinisterio()">Adicionar</button>
				</div>
			</div>

			<div style="display: flex; gap: 8px; margin-top: 16px; justify-content: flex-end;">
				<button type="button" class="btn btn-secondary" onclick="closeMemberVinculosModal()">Fechar</button>
			</div>
		</div>
	</div>

	<script src="/admin/js/app.js"></script>
	<script>
		let members = [];
		let editId = null;
		let currentMemberId = null;
		let availableEquipes = [];
		let availableMinisterios = [];

		async function loadMembers() {
			try {
				members = await window.saintScaleAdmin.api.listarMembros();
				renderMembers();
			} catch (err) {
				window.saintScaleAdmin.showAlert("alert-container", err.message, "error");
				document.getElementById("members-table-body").innerHTML = '<tr><td colspan="5" class="empty-state">Erro ao carregar membros</td></tr>';
			}
		}

		function renderMembers() {
			const tbody = document.getElementById("members-table-body");
			if (members.length === 0) {
				tbody.innerHTML = '<tr><td colspan="5" class="empty-state">Nenhum membro cadastrado</td></tr>';
				return;
			}
			tbody.innerHTML = members.map(m => `
				<tr>
					<td>${window.saintScaleAdmin.escapeHtml(m.nome)}</td>
					<td>${window.saintScaleAdmin.escapeHtml(m.email)}</td>
					<td>${window.saintScaleAdmin.badgeForRole(m.cargo)}</td>
					<td>${window.saintScaleAdmin.badgeForStatus(m.status)}</td>
					<td>
						<div class="table-actions">
							<button class="btn btn-outline btn-sm" onclick="openEditModal(${m.id})">Editar</button>
							<button class="btn btn-primary btn-sm" onclick="openVinculosModal(${m.id}, '${window.saintScaleAdmin.escapeHtml(m.nome)}')">Vínculos</button>
							<button class="btn btn-danger btn-sm" onclick="deleteMember(${m.id})">Excluir</button>
						</div>
					</td>
				</tr>
			`).join("");
		}

		function openCreateModal() {
			editId = null;
			document.getElementById("modal-title").textContent = "Novo Membro";
			document.getElementById("member-form").reset();
			document.getElementById("member-id").value = "";
			document.getElementById("member-modal").style.display = "block";
			window.saintScaleAdmin.clearAlert("modal-alert");
		}

		function openEditModal(id) {
			const m = members.find(x => x.id === id);
			if (!m) return;
			editId = id;
			document.getElementById("modal-title").textContent = "Editar Membro";
			document.getElementById("member-id").value = m.id;
			document.getElementById("member-name").value = m.nome;
			document.getElementById("member-email").value = m.email;
			// Converte cargo numérico (id_cargo_fk) de volta para string do select
			let cargoValue = m.cargo;
			if (typeof cargoValue === "number") {
				cargoValue = cargoValue === 1 ? "Administrador" : "Membro";
			} else if (cargoValue == null) {
				cargoValue = "Membro";
			}
			document.getElementById("member-cargo").value = cargoValue;
			document.getElementById("member-status").value = m.status;
			document.getElementById("member-password").value = "";
			document.getElementById("member-modal").style.display = "block";
			window.saintScaleAdmin.clearAlert("modal-alert");
		}

		function closeMemberModal() {
			document.getElementById("member-modal").style.display = "none";
		}

		async function saveMember(e) {
			e.preventDefault();
			const data = {
				nome: document.getElementById("member-name").value,
				email: document.getElementById("member-email").value,
				cargo: document.getElementById("member-cargo").value,
				status: document.getElementById("member-status").value,
			};
			const pw = document.getElementById("member-password").value;
			if (pw) data.senha = pw;

			try {
				if (editId) {
					await window.saintScaleAdmin.api.atualizarMembro(editId, data);
				} else {
					await window.saintScaleAdmin.api.criarMembro(data);
				}
				closeMemberModal();
				loadMembers();
			} catch (err) {
				window.saintScaleAdmin.showAlert("modal-alert", err.message, "error");
			}
		}

		async function deleteMember(id) {
			if (!confirm("Tem certeza que deseja excluir este membro?")) return;
			try {
				await window.saintScaleAdmin.api.excluirMembro(id);
				loadMembers();
			} catch (err) {
				window.saintScaleAdmin.showAlert("alert-container", err.message, "error");
			}
		}

		async function openVinculosModal(idMembro, nomeMembro) {
			currentMemberId = idMembro;
			document.getElementById("member-vinculos-modal-title").textContent = `Vínculos do Membro: ${nomeMembro}`;
			document.getElementById("member-vinculos-modal").style.display = "block";
			window.saintScaleAdmin.clearAlert("member-vinculos-modal-alert");
			await loadMemberEquipes();
			await loadMemberMinisterios();
			await loadAvailableEquipes();
			await loadAvailableMinisterios();
		}

		function closeMemberVinculosModal() {
			document.getElementById("member-vinculos-modal").style.display = "none";
			currentMemberId = null;
		}

		async function loadMemberEquipes() {
			if (!currentMemberId) return;
			try {
				document.getElementById("member-equipes-loading").style.display = "block";
				document.getElementById("member-equipes-table").style.display = "none";
				document.getElementById("member-equipes-empty").style.display = "none";
				document.getElementById("member-equipes-table-body").innerHTML = "";

				// Get all teams and filter those where this member is part of
				const todasEquipes = await window.saintScaleAdmin.api.listarEquipes();
				const memberEquipes = [];
				for (const equipe of todasEquipes) {
					const membros = await window.saintScaleAdmin.api.listarMembrosEquipe(equipe.id);
					if (membros.some(m => m.id === currentMemberId)) {
						memberEquipes.push(equipe);
					}
				}
				renderMemberEquipes(memberEquipes);
			} catch (err) {
				window.saintScaleAdmin.showAlert("member-vinculos-modal-alert", err.message, "error");
				document.getElementById("member-equipes-loading").style.display = "none";
				document.getElementById("member-equipes-empty").style.display = "block";
				document.getElementById("member-equipes-empty").textContent = "Erro ao carregar equipes";
			}
		}

		function renderMemberEquipes(equipes) {
			document.getElementById("member-equipes-loading").style.display = "none";
			const tbody = document.getElementById("member-equipes-table-body");
			if (equipes.length === 0) {
				document.getElementById("member-equipes-table").style.display = "none";
				document.getElementById("member-equipes-empty").style.display = "block";
				return;
			}
			document.getElementById("member-equipes-table").style.display = "table";
			document.getElementById("member-equipes-empty").style.display = "none";
			tbody.innerHTML = equipes.map(e => `
				<tr>
					<td>${window.saintScaleAdmin.escapeHtml(e.nome)}</td>
					<td>
						<button class="btn btn-danger btn-sm" onclick="removeMembroDeEquipe(${e.id})">Remover</button>
					</td>
				</tr>
			`).join("");
		}

		async function loadMemberMinisterios() {
			if (!currentMemberId) return;
			try {
				document.getElementById("member-ministerios-loading").style.display = "block";
				document.getElementById("member-ministerios-table").style.display = "none";
				document.getElementById("member-ministerios-empty").style.display = "none";
				document.getElementById("member-ministerios-table-body").innerHTML = "";

				// Get all ministries and filter those where this member is part of
				const todosMinisterios = await window.saintScaleAdmin.api.listarMinisterios();
				const memberMinisterios = [];
				for (const ministerio of todosMinisterios) {
					const membros = await window.saintScaleAdmin.api.listarMembrosMinisterio(ministerio.id);
					if (membros.some(m => m.id === currentMemberId)) {
						memberMinisterios.push(ministerio);
					}
				}
				renderMemberMinisterios(memberMinisterios);
			} catch (err) {
				window.saintScaleAdmin.showAlert("member-vinculos-modal-alert", err.message, "error");
				document.getElementById("member-ministerios-loading").style.display = "none";
				document.getElementById("member-ministerios-empty").style.display = "block";
				document.getElementById("member-ministerios-empty").textContent = "Erro ao carregar ministérios";
			}
		}

		function renderMemberMinisterios(ministerios) {
			document.getElementById("member-ministerios-loading").style.display = "none";
			const tbody = document.getElementById("member-ministerios-table-body");
			if (ministerios.length === 0) {
				document.getElementById("member-ministerios-table").style.display = "none";
				document.getElementById("member-ministerios-empty").style.display = "block";
				return;
			}
			document.getElementById("member-ministerios-table").style.display = "table";
			document.getElementById("member-ministerios-empty").style.display = "none";
			tbody.innerHTML = ministerios.map(m => `
				<tr>
					<td>${window.saintScaleAdmin.escapeHtml(m.nome)}</td>
					<td>
						<button class="btn btn-danger btn-sm" onclick="removeMembroDoMinisterio(${m.id})">Remover</button>
					</td>
				</tr>
			`).join("");
		}

		async function loadAvailableEquipes() {
			try {
				const todasEquipes = await window.saintScaleAdmin.api.listarEquipes();
				availableEquipes = todasEquipes;
				const select = document.getElementById("member-equipe-select");
				select.innerHTML = '<option value="">Selecione uma equipe</option>';
				todasEquipes.forEach(e => {
					const option = document.createElement("option");
					option.value = e.id;
					option.textContent = e.nome;
					select.appendChild(option);
				});
			} catch (err) {
				window.saintScaleAdmin.showAlert("member-vinculos-modal-alert", err.message, "error");
			}
		}

		async function loadAvailableMinisterios() {
			try {
				const todosMinisterios = await window.saintScaleAdmin.api.listarMinisterios();
				availableMinisterios = todosMinisterios;
				const select = document.getElementById("member-ministerio-select");
				select.innerHTML = '<option value="">Selecione um ministério</option>';
				todosMinisterios.forEach(m => {
					const option = document.createElement("option");
					option.value = m.id;
					option.textContent = m.nome;
					select.appendChild(option);
				});
			} catch (err) {
				window.saintScaleAdmin.showAlert("member-vinculos-modal-alert", err.message, "error");
			}
		}

		async function addMembroAEquipe() {
			const idEquipe = document.getElementById("member-equipe-select").value;
			if (!idEquipe) {
				window.saintScaleAdmin.showAlert("member-vinculos-modal-alert", "Selecione uma equipe", "error");
				return;
			}
			if (!currentMemberId) return;

			try {
				await window.saintScaleAdmin.api.adicionarMembroEquipe(Number(idEquipe), currentMemberId);
				window.saintScaleAdmin.showAlert("member-vinculos-modal-alert", "Membro adicionado à equipe", "success");
				document.getElementById("member-equipe-select").value = "";
				await loadMemberEquipes();
				await loadAvailableEquipes();
			} catch (err) {
				window.saintScaleAdmin.showAlert("member-vinculos-modal-alert", err.message, "error");
			}
		}

		async function removeMembroDeEquipe(idEquipe) {
			if (!confirm("Tem certeza que deseja remover este membro da equipe?")) return;
			if (!currentMemberId) return;

			try {
				await window.saintScaleAdmin.api.removerMembroEquipe(idEquipe, currentMemberId);
				window.saintScaleAdmin.showAlert("member-vinculos-modal-alert", "Membro removido da equipe", "success");
				await loadMemberEquipes();
				await loadAvailableEquipes();
			} catch (err) {
				window.saintScaleAdmin.showAlert("member-vinculos-modal-alert", err.message, "error");
			}
		}

		async function addMembroAoMinisterio() {
			const idMinisterio = document.getElementById("member-ministerio-select").value;
			if (!idMinisterio) {
				window.saintScaleAdmin.showAlert("member-vinculos-modal-alert", "Selecione um ministério", "error");
				return;
			}
			if (!currentMemberId) return.

			try {
				await window.saintScaleAdmin.api.adicionarMembroMinisterio(Number(idMinisterio), currentMemberId);
				window.saintScaleAdmin.showAlert("member-vinculos-modal-alert", "Membro adicionado ao ministério", "success");
				document.getElementById("member-ministerio-select").value = "";
				await loadMemberMinisterios();
				await loadAvailableMinisterios();
			} catch (err) {
				window.saintScaleAdmin.showAlert("member-vinculos-modal-alert", err.message, "error");
			}
		}

		async function removeMembroDoMinisterio(idMinisterio) {
			if (!confirm("Tem certeza que deseja remover este membro do ministério?")) return;
			if (!currentMemberId) return.

			try {
				await window.saintScaleAdmin.api.removerMembroMinisterio(idMinisterio, currentMemberId);
				window.saintScaleAdmin.showAlert("member-vinculos-modal-alert", "Membro removido do ministério", "success");
				await loadMemberMinisterios();
				await loadAvailableMinisterios();
			} catch (err) {
				window.saintScaleAdmin.showAlert("member-vinculos-modal-alert", err.message, "error");
			}
		}

		document.getElementById("member-form").addEventListener("submit", saveMember);
		window.onclick = (e) => {
			if (e.target === document.getElementById("member-modal")) closeMemberModal();
			if (e.target === document.getElementById("member-vinculos-modal")) closeMemberVinculosModal();
		};

		if (!window.saintScaleAdmin.isAuthenticated()) {
			window.location.href = "/admin/index.html";
		} else {
			loadMembers();
		}
	</script>
</body>
</html>
