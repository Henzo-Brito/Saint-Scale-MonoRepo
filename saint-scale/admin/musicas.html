<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Músicas - SaintScale Admin</title>
	<link rel="stylesheet" href="/admin/css/style.css">
</head>
<body>
	<header class="header">
		<div class="header-content">
			<h1>Músicas</h1>
			<div class="nav-actions">
				<button class="btn btn-secondary btn-sm" onclick="location.href='/admin/dashboard.html'">Voltar</button>
				<button class="btn btn-primary btn-sm" onclick="openCreateModal()">Nova Música</button>
				<button class="btn btn-secondary btn-sm" onclick="window.saintScaleAdmin.logout()">Sair</button>
			</div>
		</div>
	</header>

	<div class="container">
		<div id="alert-container"></div>

		<div class="card">
			<div class="card-title">Lista de Músicas</div>
			<table class="table">
				<thead>
					<tr>
						<th>Nome</th>
						<th>Artista</th>
						<th>Tom</th>
						<th>Ações</th>
					</tr>
				</thead>
				<tbody id="musicas-table-body">
					<tr><td colspan="4" class="empty-state">Carregando...</td></tr>
				</tbody>
			</table>
		</div>
	</div>

	<div id="musica-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000;">
		<div style="background: var(--c6); border-radius: 8px; padding: 24px; max-width: 500px; margin: 60px auto; box-shadow: 0 4px 6px rgba(0,0,0,0.15);">
			<h3 id="modal-title" style="margin-top: 0;">Nova Música</h3>
			<div id="modal-alert"></div>
			<form id="musica-form">
				<input type="hidden" id="musica-id">
				<div class="form-group">
					<label>Nome</label>
					<input type="text" id="musica-name" required>
				</div>
				<div class="form-group">
					<label>Artista</label>
					<input type="text" id="musica-artista">
				</div>
				<div class="form-group">
					<label>Tom</label>
					<input type="text" id="musica-tom">
				</div>
				<div class="form-group">
					<label>Link (YouTube, Spotify, etc.)</label>
					<input type="url" id="musica-link" placeholder="https://...">
				</div>
				<div style="display: flex; gap: 8px; margin-top: 16px;">
					<button type="button" class="btn btn-secondary" onclick="closeMusicaModal()">Cancelar</button>
					<button type="submit" class="btn btn-primary">Salvar</button>
				</div>
			</form>
		</div>
	</div>

	<script src="/admin/js/app.js"></script>
	<script>
		let musicas = [];
		let editId = null;

		async function loadMusicas() {
			try {
				musicas = await window.saintScaleAdmin.api.listarMusicas();
				renderMusicas();
			} catch (err) {
				window.saintScaleAdmin.showAlert("alert-container", err.message, "error");
				document.getElementById("musicas-table-body").innerHTML = '<tr><td colspan="4" class="empty-state">Erro ao carregar músicas</td></tr>';
			}
		}

		function renderMusicas() {
			const tbody = document.getElementById("musicas-table-body");
			if (musicas.length === 0) {
				tbody.innerHTML = '<tr><td colspan="4" class="empty-state">Nenhuma música cadastrada</td></tr>';
				return;
			}
			tbody.innerHTML = musicas.map(m => `
				<tr>
					<td>${window.saintScaleAdmin.escapeHtml(m.nome)}</td>
					<td>${window.saintScaleAdmin.escapeHtml(m.artista) || "—"}</td>
					<td>${window.saintScaleAdmin.escapeHtml(m.tom) || "—"}</td>
					<td>
						<div class="table-actions">
							<button class="btn btn-outline btn-sm" onclick="openEditModal(${m.id})">Editar</button>
							<button class="btn btn-danger btn-sm" onclick="deleteMusica(${m.id})">Excluir</button>
						</div>
					</td>
				</tr>
			`).join("");
		}

		function openCreateModal() {
			editId = null;
			document.getElementById("modal-title").textContent = "Nova Música";
			document.getElementById("musica-form").reset();
			document.getElementById("musica-id").value = "";
			document.getElementById("musica-modal").style.display = "block";
			window.saintScaleAdmin.clearAlert("modal-alert");
		}

		function openEditModal(id) {
			const m = musicas.find(x => x.id === id);
			if (!m) return;
			editId = id;
			document.getElementById("modal-title").textContent = "Editar Música";
			document.getElementById("musica-id").value = m.id;
			document.getElementById("musica-name").value = m.nome;
			document.getElementById("musica-artista").value = m.artista || "";
			document.getElementById("musica-tom").value = m.tom || "";
			document.getElementById("musica-link").value = m.link || "";
			document.getElementById("musica-modal").style.display = "block";
			window.saintScaleAdmin.clearAlert("modal-alert");
		}

		function closeMusicaModal() {
			document.getElementById("musica-modal").style.display = "none";
		}

		async function saveMusica(e) {
			e.preventDefault();
			const data = {
				nome: document.getElementById("musica-name").value,
			};
			const artista = document.getElementById("musica-artista").value.trim();
			if (artista) data.artista = artista;
			const tom = document.getElementById("musica-tom").value.trim();
			if (tom) data.tom = tom;
			const link = document.getElementById("musica-link").value.trim();
			if (link) data.link = link;

			try {
				if (editId) {
					await window.saintScaleAdmin.api.atualizarMusica(editId, data);
				} else {
					await window.saintScaleAdmin.api.criarMusica(data);
				}
				closeMusicaModal();
				loadMusicas();
			} catch (err) {
				window.saintScaleAdmin.showAlert("modal-alert", err.message, "error");
			}
		}

		async function deleteMusica(id) {
			if (!confirm("Tem certeza que deseja excluir esta música?")) return;
			try {
				await window.saintScaleAdmin.api.excluirMusica(id);
				loadMusicas();
			} catch (err) {
				window.saintScaleAdmin.showAlert("alert-container", err.message, "error");
			}
		}

		document.getElementById("musica-form").addEventListener("submit", saveMusica);
		window.onclick = (e) => {
			if (e.target === document.getElementById("musica-modal")) closeMusicaModal();
		};

		if (!window.saintScaleAdmin.isAuthenticated()) {
			window.location.href = "/admin/index.html";
		} else {
			loadMusicas();
		}
	</script>
</body>
</html>
