<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Funções - SaintScale Admin</title>
	<link rel="stylesheet" href="/admin/css/style.css">
</head>
<body>
	<header class="header">
		<div class="header-content">
			<h1>Funções</h1>
			<div class="nav-actions">
				<button class="btn btn-secondary btn-sm" onclick="location.href='/admin/dashboard.html'">Voltar</button>
				<button class="btn btn-primary btn-sm" onclick="openCreateModal()">Nova Função</button>
				<button class="btn btn-secondary btn-sm" onclick="window.saintScaleAdmin.logout()">Sair</button>
			</div>
		</div>
	</header>

	<div class="container">
		<div id="alert-container"></div>

		<div class="card">
			<div class="card-title">Lista de Funções</div>
			<p style="color: var(--c5); font-size: 13px; margin-bottom: 16px;">
				Funções são as atividades que os membros exercem (ex: Guitarrista, Vocal, Baterista).
				Os membros selecionam suas funções a partir desta lista no aplicativo.
			</p>
			<table class="table">
				<thead>
					<tr>
						<th>Nome</th>
						<th>Ações</th>
					</tr>
				</thead>
				<tbody id="funcoes-table-body">
					<tr><td colspan="2" class="empty-state">Carregando...</td></tr>
				</tbody>
			</table>
		</div>
	</div>

	<!-- Modal Criar/Editar -->
	<div id="funcao-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000;">
		<div style="background: var(--c6); border-radius: 8px; padding: 24px; max-width: 400px; margin: 120px auto; box-shadow: 0 4px 6px rgba(0,0,0,0.15);">
			<h3 id="modal-title" style="margin-top: 0;">Nova Função</h3>
			<div id="modal-alert"></div>
			<form id="funcao-form">
				<input type="hidden" id="funcao-id">
				<div class="form-group">
					<label>Nome</label>
					<input type="text" id="funcao-nome" required placeholder="Ex: Guitarrista, Vocal, Baterista...">
				</div>
				<div style="display: flex; gap: 8px; margin-top: 16px;">
					<button type="button" class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
					<button type="submit" class="btn btn-primary">Salvar</button>
				</div>
			</form>
		</div>
	</div>

	<script src="/admin/js/app.js"></script>
	<script>
		let funcoes = [];
		let editId = null;

		async function loadFuncoes() {
			try {
				funcoes = await window.saintScaleAdmin.api.listarFuncoesIgreja();
				renderFuncoes();
			} catch (err) {
				window.saintScaleAdmin.showAlert("alert-container", err.message, "error");
				document.getElementById("funcoes-table-body").innerHTML = '<tr><td colspan="2" class="empty-state">Erro ao carregar funções</td></tr>';
			}
		}

		function renderFuncoes() {
			const tbody = document.getElementById("funcoes-table-body");
			if (funcoes.length === 0) {
				tbody.innerHTML = '<tr><td colspan="2" class="empty-state">Nenhuma função cadastrada</td></tr>';
				return;
			}
			tbody.innerHTML = funcoes.map(f => `
				<tr>
					<td>${window.saintScaleAdmin.escapeHtml(f.nome)}</td>
					<td>
						<div class="table-actions">
							<button class="btn btn-outline btn-sm" onclick="openEditModal(${f.id})">Editar</button>
							<button class="btn btn-danger btn-sm" onclick="deleteFuncao(${f.id})">Excluir</button>
						</div>
					</td>
				</tr>
			`).join("");
		}

		function openCreateModal() {
			editId = null;
			document.getElementById("modal-title").textContent = "Nova Função";
			document.getElementById("funcao-form").reset();
			document.getElementById("funcao-id").value = "";
			document.getElementById("funcao-modal").style.display = "block";
			window.saintScaleAdmin.clearAlert("modal-alert");
			setTimeout(() => document.getElementById("funcao-nome").focus(), 100);
		}

		function openEditModal(id) {
			const f = funcoes.find(x => x.id === id);
			if (!f) return;
			editId = id;
			document.getElementById("modal-title").textContent = "Editar Função";
			document.getElementById("funcao-id").value = f.id;
			document.getElementById("funcao-nome").value = f.nome;
			document.getElementById("funcao-modal").style.display = "block";
			window.saintScaleAdmin.clearAlert("modal-alert");
			setTimeout(() => document.getElementById("funcao-nome").focus(), 100);
		}

		function closeModal() {
			document.getElementById("funcao-modal").style.display = "none";
		}

		async function saveFuncao(e) {
			e.preventDefault();
			const nome = document.getElementById("funcao-nome").value.trim();
			if (!nome) {
				window.saintScaleAdmin.showAlert("modal-alert", "O nome da função é obrigatório.", "error");
				return;
			}

			try {
				if (editId) {
					await window.saintScaleAdmin.api.atualizarFuncaoIgreja(editId, { nome });
				} else {
					await window.saintScaleAdmin.api.criarFuncaoIgreja({ nome });
				}
				closeModal();
				loadFuncoes();
			} catch (err) {
				window.saintScaleAdmin.showAlert("modal-alert", err.message, "error");
			}
		}

		async function deleteFuncao(id) {
			if (!confirm("Tem certeza que deseja excluir esta função? Os membros que a possuem perderão o vínculo.")) return;
			try {
				await window.saintScaleAdmin.api.excluirFuncaoIgreja(id);
				loadFuncoes();
			} catch (err) {
				window.saintScaleAdmin.showAlert("alert-container", err.message, "error");
			}
		}

		document.getElementById("funcao-form").addEventListener("submit", saveFuncao);
		window.onclick = (e) => {
			if (e.target === document.getElementById("funcao-modal")) closeModal();
		};

		if (!window.saintScaleAdmin.isAuthenticated()) {
			window.location.href = "/admin/index.html";
		} else {
			loadFuncoes();
		}
	</script>
</body>
</html>
