<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Avisos / Lembretes - SaintScale Admin</title>
	<link rel="stylesheet" href="/admin/css/style.css">
</head>
<body>
	<header class="header">
		<div class="header-content">
			<h1>Avisos / Lembretes</h1>
			<div class="nav-actions">
				<button class="btn btn-secondary btn-sm" onclick="location.href='/admin/dashboard.html'">Voltar</button>
				<button class="btn btn-primary btn-sm" onclick="openCreateModal()">Novo Aviso</button>
				<button class="btn btn-secondary btn-sm" onclick="window.saintScaleAdmin.logout()">Sair</button>
			</div>
		</div>
	</header>

	<div class="container">
		<div id="alert-container"></div>
		<div class="card">
			<div class="card-title">Avisos da Igreja</div>
			<table class="table">
				<thead>
					<tr>
						<th>Nome</th>
						<th>Data</th>
						<th>Horário</th>
						<th>Descrição</th>
						<th>Funções</th>
						<th>Ações</th>
					</tr>
				</thead>
				<tbody id="lembretes-table-body">
					<tr><td colspan="6" class="empty-state">Carregando...</td></tr>
				</tbody>
			</table>
		</div>
	</div>

	<!-- Create/Edit Modal -->
	<div id="lembrete-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000;">
		<div style="background: var(--c6); border-radius: 8px; padding: 24px; max-width: 560px; margin: 60px auto; box-shadow: 0 4px 6px rgba(0,0,0,0.15);">
			<h3 id="modal-title" style="margin-top: 0;">Novo Aviso</h3>
			<div id="modal-alert"></div>
			<form id="lembrete-form">
				<input type="hidden" id="lembrete-id">
				<div class="form-group">
					<label>Nome</label>
					<input type="text" id="lembrete-nome" required>
				</div>
				<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
					<div class="form-group">
						<label>Data</label>
						<input type="date" id="lembrete-data" required>
					</div>
					<div class="form-group">
						<label>Horário</label>
						<input type="time" id="lembrete-horario" required>
					</div>
				</div>
				<div class="form-group">
					<label>Descrição</label>
					<textarea id="lembrete-descricao" rows="3"></textarea>
				</div>
				<div class="form-group">
					<label>Funções (uma por linha)</label>
					<textarea id="lembrete-funcoes" rows="3" placeholder="Vocal
Guitarra
Baixo
Bateria"></textarea>
				</div>
				<div style="display: flex; gap: 8px; margin-top: 16px;">
					<button type="button" class="btn btn-secondary" onclick="closeLembreteModal()">Cancelar</button>
					<button type="submit" class="btn btn-primary">Salvar</button>
				</div>
			</form>
		</div>
	</div>

	<script src="/admin/js/app.js"></script>
	<script>
		let lembretes = [];
		let editId = null;

		async function loadLembretes() {
			try {
				lembretes = await window.saintScaleAdmin.api.listarLembretes();
				renderLembretes();
			} catch (err) {
				window.saintScaleAdmin.showAlert("alert-container", err.message, "error");
				document.getElementById("lembretes-table-body").innerHTML = '<tr><td colspan="6" class="empty-state">Erro ao carregar avisos</td></tr>';
			}
		}

		function renderLembretes() {
			const tbody = document.getElementById("lembretes-table-body");
			if (lembretes.length === 0) {
				tbody.innerHTML = '<tr><td colspan="6" class="empty-state">Nenhum aviso cadastrado</td></tr>';
				return;
			}
			tbody.innerHTML = lembretes.map(l => `
				<tr>
					<td>${window.saintScaleAdmin.escapeHtml(l.name)}</td>
					<td>${window.saintScaleAdmin.escapeHtml(l.date) || "—"}</td>
					<td>${window.saintScaleAdmin.escapeHtml(l.tempo) || "—"}</td>
					<td>${window.saintScaleAdmin.escapeHtml(l.description) || "—"}</td>
					<td>${(l.functions || []).join(", ") || "—"}</td>
					<td>
						<div class="table-actions">
							<button class="btn btn-outline btn-sm" onclick="openEditModal(${l.id_lembrete})">Editar</button>
							<button class="btn btn-danger btn-sm" onclick="deleteLembrete(${l.id_lembrete})">Excluir</button>
						</div>
					</td>
				</tr>
			`).join("");
		}

		function openCreateModal() {
			editId = null;
			document.getElementById("modal-title").textContent = "Novo Aviso";
			document.getElementById("lembrete-form").reset();
			document.getElementById("lembrete-id").value = "";
			document.getElementById("lembrete-modal").style.display = "block";
			window.saintScaleAdmin.clearAlert("modal-alert");
		}

		function openEditModal(id) {
			const l = lembretes.find(x => x.id_lembrete === String(id));
			if (!l) return;
			editId = id;
			document.getElementById("modal-title").textContent = "Editar Aviso";
			document.getElementById("lembrete-id").value = l.id_lembrete;
			document.getElementById("lembrete-nome").value = l.name;
			document.getElementById("lembrete-data").value = l.date || "";
			document.getElementById("lembrete-horario").value = l.tempo || "";
			document.getElementById("lembrete-descricao").value = l.description || "";
			document.getElementById("lembrete-funcoes").value = (l.functions || []).join("\n");
			document.getElementById("lembrete-modal").style.display = "block";
			window.saintScaleAdmin.clearAlert("modal-alert");
		}

		function closeLembreteModal() {
			document.getElementById("lembrete-modal").style.display = "none";
		}

		async function saveLembrete(e) {
			e.preventDefault();
			const data = {
				nome: document.getElementById("lembrete-nome").value,
				data: document.getElementById("lembrete-data").value,
				tempo: document.getElementById("lembrete-horario").value,
			};
			const descricao = document.getElementById("lembrete-descricao").value.trim();
			if (descricao) data.descricao = descricao;
			const funcoesStr = document.getElementById("lembrete-funcoes").value.trim();
			if (funcoesStr) {
				data.funcoes = funcoesStr.split("\n").map(f => f.trim()).filter(f => f);
			}

			try {
				if (editId) {
					await window.saintScaleAdmin.api.atualizarLembrete(editId, data);
				} else {
					await window.saintScaleAdmin.api.criarLembrete(data);
				}
				closeLembreteModal();
				loadLembretes();
			} catch (err) {
				window.saintScaleAdmin.showAlert("modal-alert", err.message, "error");
			}
		}

		async function deleteLembrete(id) {
			if (!confirm("Tem certeza que deseja excluir este aviso?")) return;
			try {
				await window.saintScaleAdmin.api.removerLembrete(id);
				loadLembretes();
			} catch (err) {
				window.saintScaleAdmin.showAlert("alert-container", err.message, "error");
			}
		}

		document.getElementById("lembrete-form").addEventListener("submit", saveLembrete);
		window.onclick = (e) => {
			if (e.target === document.getElementById("lembrete-modal")) closeLembreteModal();
		};

		if (!window.saintScaleAdmin.isAuthenticated()) {
			window.location.href = "/admin/index.html";
		} else {
			loadLembretes();
		}
	</script>
</body>
</html>
