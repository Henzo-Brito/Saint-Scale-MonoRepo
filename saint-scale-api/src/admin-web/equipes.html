<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Equipes - SaintScale Admin</title>
	<link rel="stylesheet" href="/admin/css/style.css">
</head>
<body>
	<header class="header">
		<div class="header-content">
			<h1>Equipes</h1>
			<div class="nav-actions">
				<button class="btn btn-secondary btn-sm" onclick="location.href='/admin/dashboard.html'">Voltar</button>
				<button class="btn btn-primary btn-sm" onclick="openCreateModal()">Nova Equipe</button>
				<button class="btn btn-secondary btn-sm" onclick="window.saintScaleAdmin.logout()">Sair</button>
			</div>
		</div>
	</header>

	<div class="container">
		<div id="alert-container"></div>

		<div class="card">
			<div class="card-title">Lista de Equipes</div>
			<table class="table">
				<thead>
					<tr>
						<th>Nome</th>
						<th>Ações</th>
					</tr>
				</thead>
				<tbody id="equipes-table-body">
					<tr><td colspan="2" class="empty-state">Carregando...</td></tr>
				</tbody>
			</table>
		</div>
	</div>

	<div id="equipe-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000;">
		<div style="background: var(--c6); border-radius: 8px; padding: 24px; max-width: 500px; margin: 60px auto; box-shadow: 0 4px 6px rgba(0,0,0,0.15);">
			<h3 id="modal-title" style="margin-top: 0;">Nova Equipe</h3>
			<div id="modal-alert"></div>
			<form id="equipe-form">
				<input type="hidden" id="equipe-id">
				<div class="form-group">
					<label>Nome</label>
					<input type="text" id="equipe-name" required>
				</div>
				<div style="display: flex; gap: 8px; margin-top: 16px;">
					<button type="button" class="btn btn-secondary" onclick="closeEquipeModal()">Cancelar</button>
					<button type="submit" class="btn btn-primary">Salvar</button>
				</div>
			</form>
		</div>
	</div>

	<div id="equipe-membros-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1001;">
		<div style="background: var(--c6); border-radius: 8px; padding: 24px; max-width: 600px; margin: 60px auto; box-shadow: 0 4px 6px rgba(0,0,0,0.15); max-height: 80vh; overflow-y: auto;">
			<h3 id="equipe-membros-modal-title" style="margin-top: 0;">Membros da Equipe</h3>
			<div id="equipe-membros-modal-alert"></div>
			<div id="equipe-membros-loading" style="text-align: center; padding: 20px;">Carregando...</div>
			<table class="table" id="equipe-membros-table" style="display: none;">
				<thead>
					<tr>
						<th>Nome</th>
						<th>E-mail</th>
						<th>Ações</th>
					</tr>
				</thead>
				<tbody id="equipe-membros-table-body">
				</tbody>
			</table>
			<div id="equipe-membros-empty" style="display: none; text-align: center; padding: 20px; color: var(--c3);">Nenhum membro nesta equipe</div>
			<div style="margin-top: 16px;">
				<label>Adicionar membro</label>
				<select id="equipe-membro-select" class="form-control" style="display: inline-block; width: auto; margin-right: 8px;">
					<option value="">Selecione um membro</option>
				</select>
				<button class="btn btn-primary btn-sm" onclick="addMembroAEquipe()">Adicionar</button>
			</div>
			<div style="display: flex; gap: 8px; margin-top: 16px; justify-content: flex-end;">
				<button type="button" class="btn btn-secondary" onclick="closeEquipeMembrosModal()">Fechar</button>
			</div>
		</div>
	</div>

	<script src="/admin/js/app.js"></script>
	<script>
		let equipes = [];
		let editId = null;
		let currentEquipeId = null;
		let availableMembros = [];

		async function loadEquipes() {
			try {
				equipes = await window.saintScaleAdmin.api.listarEquipes();
				renderEquipes();
			} catch (err) {
				window.saintScaleAdmin.showAlert("alert-container", err.message, "error");
				document.getElementById("equipes-table-body").innerHTML = '<tr><td colspan="2" class="empty-state">Erro ao carregar equipes</td></tr>';
			}
		}

		function renderEquipes() {
			const tbody = document.getElementById("equipes-table-body");
			if (equipes.length === 0) {
				tbody.innerHTML = '<tr><td colspan="2" class="empty-state">Nenhuma equipe cadastrada</td></tr>';
				return;
			}
			tbody.innerHTML = equipes.map(e => `
				<tr>
					<td>${window.saintScaleAdmin.escapeHtml(e.nome)}</td>
					<td>
						<div class="table-actions">
							<button class="btn btn-outline btn-sm" onclick="openEditModal(${e.id})">Editar</button>
							<button class="btn btn-primary btn-sm" onclick="openMembrosModal(${e.id}, '${window.saintScaleAdmin.escapeHtml(e.nome)}')">Membros</button>
							<button class="btn btn-danger btn-sm" onclick="deleteEquipe(${e.id})">Excluir</button>
						</div>
					</td>
				</tr>
			`).join("");
		}

		function openCreateModal() {
			editId = null;
			document.getElementById("modal-title").textContent = "Nova Equipe";
			document.getElementById("equipe-form").reset();
			document.getElementById("equipe-id").value = "";
			document.getElementById("equipe-modal").style.display = "block";
			window.saintScaleAdmin.clearAlert("modal-alert");
		}

		function openEditModal(id) {
			const e = equipes.find(x => x.id === id);
			if (!e) return;
			editId = id;
			document.getElementById("modal-title").textContent = "Editar Equipe";
			document.getElementById("equipe-id").value = e.id;
			document.getElementById("equipe-name").value = e.nome;
			document.getElementById("equipe-modal").style.display = "block";
			window.saintScaleAdmin.clearAlert("modal-alert");
		}

		function closeEquipeModal() {
			document.getElementById("equipe-modal").style.display = "none";
		}

		async function saveEquipe(e) {
			e.preventDefault();
			const data = {
				nome: document.getElementById("equipe-name").value,
			};

			try {
				if (editId) {
					await window.saintScaleAdmin.api.atualizarEquipe(editId, data);
				} else {
					await window.saintScaleAdmin.api.criarEquipe(data);
				}
				closeEquipeModal();
				loadEquipes();
			} catch (err) {
				window.saintScaleAdmin.showAlert("modal-alert", err.message, "error");
			}
		}

		async function deleteEquipe(id) {
			if (!confirm("Tem certeza que deseja excluir esta equipe?")) return;
			try {
				await window.saintScaleAdmin.api.excluirEquipe(id);
				loadEquipes();
			} catch (err) {
				window.saintScaleAdmin.showAlert("alert-container", err.message, "error");
			}
		}

		async function openMembrosModal(idEquipe, nomeEquipe) {
			currentEquipeId = idEquipe;
			document.getElementById("equipe-membros-modal-title").textContent = `Membros da Equipe: ${nomeEquipe}`;
			document.getElementById("equipe-membros-modal").style.display = "block";
			window.saintScaleAdmin.clearAlert("equipe-membros-modal-alert");
			await loadMembrosEquipe();
			await loadAvailableMembros();
		}

		function closeEquipeMembrosModal() {
			document.getElementById("equipe-membros-modal").style.display = "none";
			currentEquipeId = null;
		}

		async function loadMembrosEquipe() {
			if (!currentEquipeId) return;
			try {
				document.getElementById("equipe-membros-loading").style.display = "block";
				document.getElementById("equipe-membros-table").style.display = "none";
				document.getElementById("equipe-membros-empty").style.display = "none";
				document.getElementById("equipe-membros-table-body").innerHTML = "";

				const membros = await window.saintScaleAdmin.api.listarMembrosEquipe(currentEquipeId);
				renderMembrosEquipe(membros);
			} catch (err) {
				window.saintScaleAdmin.showAlert("equipe-membros-modal-alert", err.message, "error");
				document.getElementById("equipe-membros-loading").style.display = "none";
				document.getElementById("equipe-membros-empty").style.display = "block";
				document.getElementById("equipe-membros-empty").textContent = "Erro ao carregar membros";
			}
		}

		function renderMembrosEquipe(membros) {
			document.getElementById("equipe-membros-loading").style.display = "none";
			const tbody = document.getElementById("equipe-membros-table-body");
			if (membros.length === 0) {
				document.getElementById("equipe-membros-table").style.display = "none";
				document.getElementById("equipe-membros-empty").style.display = "block";
				return;
			}
			document.getElementById("equipe-membros-table").style.display = "table";
			document.getElementById("equipe-membros-empty").style.display = "none";
			tbody.innerHTML = membros.map(m => `
				<tr>
					<td>${window.saintScaleAdmin.escapeHtml(m.nome)}</td>
					<td>${window.saintScaleAdmin.escapeHtml(m.email)}</td>
					<td>
						<button class="btn btn-danger btn-sm" onclick="removeMembroDeEquipe(${m.id})">Remover</button>
					</td>
				</tr>
			`).join("");
		}

		async function loadAvailableMembros() {
			try {
				const todosMembros = await window.saintScaleAdmin.api.listarMembros();
				availableMembros = todosMembros;
				const select = document.getElementById("equipe-membro-select");
				select.innerHTML = '<option value="">Selecione um membro</option>';
				todosMembros.forEach(m => {
					const option = document.createElement("option");
					option.value = m.id;
					option.textContent = `${m.nome} (${m.email})`;
					select.appendChild(option);
				});
			} catch (err) {
				window.saintScaleAdmin.showAlert("equipe-membros-modal-alert", err.message, "error");
			}
		}

		async function addMembroAEquipe() {
			const idMembro = document.getElementById("equipe-membro-select").value;
			if (!idMembro) {
				window.saintScaleAdmin.showAlert("equipe-membros-modal-alert", "Selecione um membro", "error");
				return;
			}
			if (!currentEquipeId) return;

			try {
				await window.saintScaleAdmin.api.adicionarMembroEquipe(currentEquipeId, Number(idMembro));
				window.saintScaleAdmin.showAlert("equipe-membros-modal-alert", "Membro adicionado à equipe", "success");
				document.getElementById("equipe-membro-select").value = "";
				await loadMembrosEquipe();
				await loadAvailableMembros();
			} catch (err) {
				window.saintScaleAdmin.showAlert("equipe-membros-modal-alert", err.message, "error");
			}
		}

		async function removeMembroDeEquipe(idMembro) {
			if (!confirm("Tem certeza que deseja remover este membro da equipe?")) return;
			if (!currentEquipeId) return;

		try {
				await window.saintScaleAdmin.api.removerMembroEquipe(currentEquipeId, idMembro);
				window.saintScaleAdmin.showAlert("equipe-membros-modal-alert", "Membro removido da equipe", "success");
				await loadMembrosEquipe();
				await loadAvailableMembros();
			} catch (err) {
				window.saintScaleAdmin.showAlert("equipe-membros-modal-alert", err.message, "error");
			}
		}

		document.getElementById("equipe-form").addEventListener("submit", saveEquipe);
		window.onclick = (e) => {
			if (e.target === document.getElementById("equipe-modal")) closeEquipeModal();
			if (e.target === document.getElementById("equipe-membros-modal")) closeEquipeMembrosModal();
		};

		if (!window.saintScaleAdmin.isAuthenticated()) {
			window.location.href = "/admin/index.html";
		} else {
			loadEquipes();
		}
	</script>
</body>
</html>
