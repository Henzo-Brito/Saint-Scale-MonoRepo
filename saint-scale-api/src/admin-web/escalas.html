<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Escalas - SaintScale Admin</title>
	<link rel="stylesheet" href="/admin/css/style.css">
</head>
<body>
	<header class="header">
		<div class="header-content">
			<h1>Escalas</h1>
			<div class="nav-actions">
				<button class="btn btn-secondary btn-sm" onclick="location.href='/admin/dashboard.html'">Voltar</button>
				<button class="btn btn-primary btn-sm" onclick="openCreateModal()">Nova Escala</button>
				<button class="btn btn-secondary btn-sm" onclick="window.saintScaleAdmin.logout()">Sair</button>
			</div>
		</div>
	</header>

	<div class="container">
		<div id="alert-container"></div>

		<div class="card">
			<div class="card-title">Lista de Escalas</div>
			<table class="table">
				<thead>
					<tr>
						<th>Nome</th>
						<th>Data</th>
						<th>Local</th>
						<th>Ações</th>
					</tr>
				</thead>
				<tbody id="escalas-table-body">
					<tr><td colspan="4" class="empty-state">Carregando...</td></tr>
				</tbody>
			</table>
		</div>
	</div>

	<div id="escala-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000;">
		<div style="background: var(--c6); border-radius: 8px; padding: 24px; max-width: 500px; margin: 60px auto; box-shadow: 0 4px 6px rgba(0,0,0,0.15);">
			<h3 id="modal-title" style="margin-top: 0;">Nova Escala</h3>
			<div id="modal-alert"></div>
			<form id="escala-form">
				<input type="hidden" id="escala-id">
				<div class="form-group">
					<label>Nome</label>
					<input type="text" id="escala-name" required>
				</div>
				<div class="form-group">
					<label>Data e Hora</label>
					<input type="datetime-local" id="escala-data" required>
				</div>
				<div class="form-group">
					<label>Local</label>
					<select id="escala-local">
						<option value="">— Sem local —</option>
					</select>
				</div>
				<div class="form-group">
					<label>Descrição</label>
					<input type="text" id="escala-descricao">
				</div>
				<div style="display: flex; gap: 8px; margin-top: 16px;">
					<button type="button" class="btn btn-secondary" onclick="closeEscalaModal()">Cancelar</button>
					<button type="submit" class="btn btn-primary">Salvar</button>
				</div>
			</form>
		</div>
	</div>

	<div id="escala-membros-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000;">
		<div style="background: var(--c6); border-radius: 8px; padding: 24px; max-width: 560px; margin: 60px auto; box-shadow: 0 4px 6px rgba(0,0,0,0.15);">
			<h3 id="escala-membros-modal-title" style="margin-top: 0;">Membros da Escala</h3>
			<div id="escala-membros-modal-alert"></div>
			<div style="margin: 16px 0;">
				<label style="display:block; margin-bottom: 6px; font-weight: 600;">Adicionar membro</label>
				<select id="escala-membro-select"></select>
				<button class="btn btn-primary btn-sm" style="margin-left: 8px;" onclick="addMembroAEscala()">Adicionar</button>
			</div>
			<div style="display: flex; gap: 8px; align-items: center; margin: 12px 0;">
				<span id="escala-membros-loading" style="display:none; font-size: 0.9rem; color: var(--c5);">Carregando...</span>
				<span id="escala-membros-empty" style="display:none; font-size: 0.9rem; color: var(--c5);">Nenhum membro associado</span>
			</div>
			<table class="table" id="escala-membros-table" style="display:none; width:100%; margin-top: 8px;">
				<thead>
					<tr><th>Nome</th><th>E-mail</th><th>Função</th><th style="width:110px;">Ação</th></tr>
				</thead>
				<tbody id="escala-membros-table-body"></tbody>
			</table>
			<div style="margin-top: 16px; display: flex; gap: 8px; justify-content: flex-end;">
				<button class="btn btn-secondary" onclick="closeMembrosModal()">Fechar</button>
			</div>
		</div>
	</div>

	<div id="escala-musicas-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000;">
		<div style="background: var(--c6); border-radius: 8px; padding: 24px; max-width: 620px; margin: 60px auto; box-shadow: 0 4px 6px rgba(0,0,0,0.15);">
			<h3 id="escala-musicas-modal-title" style="margin-top: 0;">Músicas da Escala</h3>
			<div id="escala-musicas-modal-alert"></div>
			<div style="margin: 16px 0;">
				<label style="display:block; margin-bottom: 6px; font-weight: 600;">Adicionar música</label>
				<select id="escala-musica-select"></select>
				<button class="btn btn-primary btn-sm" style="margin-left: 8px;" onclick="addMusicaAEscala()">Adicionar</button>
			</div>
			<div style="display: flex; gap: 8px; align-items: center; margin: 12px 0;">
				<span id="escala-musicas-loading" style="display:none; font-size: 0.9rem; color: var(--c5);">Carregando...</span>
				<span id="escala-musicas-empty" style="display:none; font-size: 0.9rem; color: var(--c5);">Nenhuma música vinculada</span>
			</div>
			<table class="table" id="escala-musicas-table" style="display:none; width:100%; margin-top: 8px;">
				<thead>
					<tr><th>Nome</th><th>Artista</th><th>Tom</th><th style="width:90px;">Ordem</th><th style="width:110px;">Ação</th></tr>
				</thead>
				<tbody id="escala-musicas-table-body"></tbody>
			</table>
			<div style="margin-top: 16px; display: flex; gap: 8px; justify-content: flex-end;">
				<button class="btn btn-secondary" onclick="closeMusicasModal()">Fechar</button>
			</div>
		</div>
	</div>

	<script src="/admin/js/app.js"></script>
	<script>
		let escalas = [];
		let locais = [];
		let editId = null;
		let currentEscalaId = null;
		let funcoes = [];
		const savingFuncaoRows = new Set();
		const savingMusicaRows = new Set();

		async function loadEscalas() {
			try {
				escalas = await window.saintScaleAdmin.api.listarEscalas();
				renderEscalas();
			} catch (err) {
				window.saintScaleAdmin.showAlert("alert-container", err.message, "error");
				document.getElementById("escalas-table-body").innerHTML = '<tr><td colspan="4" class="empty-state">Erro ao carregar escalas</td></tr>';
			}
		}

		async function loadLocais() {
			try {
				locais = await window.saintScaleAdmin.api.listarLocais();
			} catch (err) {
				locais = [];
			}
		}

		function populateLocalSelect(valorAtual) {
			const select = document.getElementById("escala-local");
			select.innerHTML = '<option value="">— Sem local —</option>';
			locais.forEach(l => {
				const option = document.createElement("option");
				option.value = l.nome;
				option.textContent = l.nome;
				if (l.nome === valorAtual) option.selected = true;
				select.appendChild(option);
			});
		}

		function renderEscalas() {
			const tbody = document.getElementById("escalas-table-body");
			if (escalas.length === 0) {
				tbody.innerHTML = '<tr><td colspan="4" class="empty-state">Nenhuma escala cadastrada</td></tr>';
				return;
			}
			tbody.innerHTML = escalas.map(e => `
				<tr>
					<td>${window.saintScaleAdmin.escapeHtml(e.nome)}</td>
					<td>${e.data ? e.data.replace("T", " ").slice(0, 16) : "—"}</td>
					<td>${window.saintScaleAdmin.escapeHtml(e.local) || "—"}</td>
					<td>
						<div class="table-actions">
							<button class="btn btn-outline btn-sm" onclick="openEditModal(${e.id})">Editar</button>
							<button class="btn btn-danger btn-sm" onclick="deleteEscala(${e.id})">Excluir</button>
							<button class="btn btn-outline btn-sm" onclick="openMembrosModal(${e.id})">Membros</button>
							<button class="btn btn-outline btn-sm" onclick="openMusicasModal(${e.id})">Músicas</button>
						</div>
					</td>
				</tr>
			`).join("");
		}

		async function openCreateModal() {
			editId = null;
			document.getElementById("modal-title").textContent = "Nova Escala";
			document.getElementById("escala-form").reset();
			document.getElementById("escala-id").value = "";
			await loadLocais();
			populateLocalSelect("");
			document.getElementById("escala-modal").style.display = "block";
			window.saintScaleAdmin.clearAlert("modal-alert");
		}

		async function openEditModal(id) {
			const e = escalas.find(x => x.id === id);
			if (!e) return;
			editId = id;
			document.getElementById("modal-title").textContent = "Editar Escala";
			document.getElementById("escala-id").value = e.id;
			document.getElementById("escala-name").value = e.nome;
			document.getElementById("escala-data").value = e.data || "";
			document.getElementById("escala-descricao").value = e.descricao || "";
			await loadLocais();
			populateLocalSelect(e.local || "");
			document.getElementById("escala-modal").style.display = "block";
			window.saintScaleAdmin.clearAlert("modal-alert");
		}

		function closeEscalaModal() {
			document.getElementById("escala-modal").style.display = "none";
		}

		async function saveEscala(e) {
			e.preventDefault();
			const data = {
				nome: document.getElementById("escala-name").value,
				data: document.getElementById("escala-data").value,
			};
			const local = document.getElementById("escala-local").value;
			if (local) data.local = local;
			const descricao = document.getElementById("escala-descricao").value.trim();
			if (descricao) data.descricao = descricao;

			try {
				if (editId) {
					await window.saintScaleAdmin.api.atualizarEscala(editId, data);
				} else {
					await window.saintScaleAdmin.api.criarEscala(data);
				}
				closeEscalaModal();
				loadEscalas();
			} catch (err) {
				window.saintScaleAdmin.showAlert("modal-alert", err.message, "error");
			}
		}

		async function deleteEscala(id) {
			if (!confirm("Tem certeza que deseja excluir esta escala?")) return;
			try {
				await window.saintScaleAdmin.api.excluirEscala(id);
				loadEscalas();
			} catch (err) {
				window.saintScaleAdmin.showAlert("alert-container", err.message, "error");
			}
		}

		async function openMembrosModal(idEscala) {
			const e = escalas.find(x => x.id === idEscala);
			const nomeEscala = e ? e.nome : "";
			currentEscalaId = idEscala;
			document.getElementById("escala-membros-modal-title").textContent = `Membros da Escala: ${nomeEscala}`;
			document.getElementById("escala-membros-modal").style.display = "block";
			window.saintScaleAdmin.clearAlert("escala-membros-modal-alert");
			await loadFuncoes();
			await loadMembrosEscala();
			await loadAvailableMembros();
		}

		async function loadFuncoes() {
			try {
				funcoes = await window.saintScaleAdmin.api.listarFuncoes();
			} catch (err) {
				funcoes = [];
				window.saintScaleAdmin.showAlert("escala-membros-modal-alert", err.message, "error");
			}
		}

		function closeMembrosModal() {
			document.getElementById("escala-membros-modal").style.display = "none";
			currentEscalaId = null;
		}

		async function loadMembrosEscala() {
			if (!currentEscalaId) return;
			try {
				document.getElementById("escala-membros-loading").style.display = "block";
				document.getElementById("escala-membros-table").style.display = "none";
				document.getElementById("escala-membros-empty").style.display = "none";
				document.getElementById("escala-membros-table-body").innerHTML = "";

				const membros = await window.saintScaleAdmin.api.listarMembrosEscala(currentEscalaId);
				renderMembrosEscala(membros);
			} catch (err) {
				window.saintScaleAdmin.showAlert("escala-membros-modal-alert", err.message, "error");
				document.getElementById("escala-membros-loading").style.display = "none";
				document.getElementById("escala-membros-empty").style.display = "block";
				document.getElementById("escala-membros-empty").textContent = "Erro ao carregar membros";
			}
		}

		function renderMembrosEscala(membros) {
			document.getElementById("escala-membros-loading").style.display = "none";
			const tbody = document.getElementById("escala-membros-table-body");
			if (membros.length === 0) {
				document.getElementById("escala-membros-table").style.display = "none";
				document.getElementById("escala-membros-empty").style.display = "block";
				return;
			}
			document.getElementById("escala-membros-table").style.display = "table";
			document.getElementById("escala-membros-empty").style.display = "none";
			const funcaoOptions = funcoes
				.map(
					(f) =>
						`<option value="${f.id}">${window.saintScaleAdmin.escapeHtml(f.nome)}</option>`,
				)
				.join("");
			tbody.innerHTML = membros
				.map(
					(m) => `
				<tr>
					<td>${window.saintScaleAdmin.escapeHtml(m.nome)}</td>
					<td>${window.saintScaleAdmin.escapeHtml(m.email)}</td>
					<td>
						<select id="funcao-select-${m.id}" onchange="alterarFuncaoMembro(${m.id}, this.value)"
							${savingFuncaoRows.has(`${currentEscalaId}-${m.id}`) ? "disabled" : ""}>
							<option value="" ${!m.id_funcao_fk ? "selected" : ""}>— (sem função)</option>
							${funcaoOptions}
						</select>
					</td>
					<td>
						<button class="btn btn-danger btn-sm" onclick="removeMembroDeEscala(${m.id})">Remover</button>
					</td>
				</tr>
			`,
				)
				.join("");
			// Marca a função atualmente atribuída como selecionada nos selects renderizados
			membros.forEach((m) => {
				const select = document.getElementById(`funcao-select-${m.id}`);
				if (select) {
					select.value = m.id_funcao_fk ? String(m.id_funcao_fk) : "";
				}
			});
		}

		async function alterarFuncaoMembro(idMembro, valor) {
			if (!currentEscalaId) return;
			const idFuncao = valor === "" || valor == null ? null : Number(valor);
			const rowKey = `${currentEscalaId}-${idMembro}`;
			savingFuncaoRows.add(rowKey);
			const select = document.getElementById(`funcao-select-${idMembro}`);
			if (select) select.disabled = true;
			try {
				await window.saintScaleAdmin.api.atribuirFuncaoMembroEscala(
					currentEscalaId,
					idMembro,
					idFuncao,
				);
				window.saintScaleAdmin.showAlert(
					"escala-membros-modal-alert",
					idFuncao === null
						? "Função removida do membro"
						: "Função atribuída ao membro",
					"success",
				);
				await loadMembrosEscala();
			} catch (err) {
				window.saintScaleAdmin.showAlert(
					"escala-membros-modal-alert",
					err.message,
					"error",
				);
				// Restaura o select para o valor anterior ao recarregar
				await loadMembrosEscala();
			} finally {
				savingFuncaoRows.delete(rowKey);
				const sel = document.getElementById(`funcao-select-${idMembro}`);
				if (sel) sel.disabled = false;
			}
		}

		async function loadAvailableMembros() {
			try {
				const todosMembros = await window.saintScaleAdmin.api.listarMembros();
				const select = document.getElementById("escala-membro-select");
				select.innerHTML = '<option value="">Selecione um membro</option>';
				todosMembros.forEach(m => {
					const option = document.createElement("option");
					option.value = m.id;
					option.textContent = `${m.nome} (${m.email})`;
					select.appendChild(option);
				});
			} catch (err) {
				window.saintScaleAdmin.showAlert("escala-membros-modal-alert", err.message, "error");
			}
		}

		async function addMembroAEscala() {
			if (!currentEscalaId) return;
			const idMembro = document.getElementById("escala-membro-select").value;
			if (!idMembro) {
				window.saintScaleAdmin.showAlert("escala-membros-modal-alert", "Selecione um membro", "error");
				return;
			}
			const btn = document.querySelector("#escala-membros-modal button.btn-primary");
			const originalText = btn.textContent;
			btn.textContent = "Adicionando...";
			btn.disabled = true;
			try {
				await window.saintScaleAdmin.api.adicionarMembroEscala(currentEscalaId, Number(idMembro));
				window.saintScaleAdmin.showAlert("escala-membros-modal-alert", "Membro adicionado à escala", "success");
				document.getElementById("escala-membro-select").value = "";
				await loadMembrosEscala();
				await loadAvailableMembros();
			} catch (err) {
				window.saintScaleAdmin.showAlert("escala-membros-modal-alert", err.message, "error");
			} finally {
				btn.textContent = originalText;
				btn.disabled = false;
			}
		}

		async function removeMembroDeEscala(idMembro) {
			if (!currentEscalaId) return;
			if (!confirm("Tem certeza que deseja remover este membro da escala?")) return;
			try {
				await window.saintScaleAdmin.api.removerMembroEscala(currentEscalaId, idMembro);
				window.saintScaleAdmin.showAlert("escala-membros-modal-alert", "Membro removido da escala", "success");
				await loadMembrosEscala();
				await loadAvailableMembros();
			} catch (err) {
				window.saintScaleAdmin.showAlert("escala-membros-modal-alert", err.message, "error");
			}
		}

		async function openMusicasModal(idEscala) {
			const e = escalas.find(x => x.id === idEscala);
			const nomeEscala = e ? e.nome : "";
			currentEscalaId = idEscala;
			document.getElementById("escala-musicas-modal-title").textContent = `Músicas da Escala: ${nomeEscala}`;
			document.getElementById("escala-musicas-modal").style.display = "block";
			window.saintScaleAdmin.clearAlert("escala-musicas-modal-alert");
			await loadMusicasEscala();
			await loadAvailableMusicas();
		}

		function closeMusicasModal() {
			document.getElementById("escala-musicas-modal").style.display = "none";
			currentEscalaId = null;
		}

		async function loadMusicasEscala() {
			if (!currentEscalaId) return;
			try {
				document.getElementById("escala-musicas-loading").style.display = "block";
				document.getElementById("escala-musicas-table").style.display = "none";
				document.getElementById("escala-musicas-empty").style.display = "none";
				document.getElementById("escala-musicas-table-body").innerHTML = "";

				const musicas = await window.saintScaleAdmin.api.listarMusicasEscala(currentEscalaId);
				renderMusicasEscala(musicas);
			} catch (err) {
				window.saintScaleAdmin.showAlert("escala-musicas-modal-alert", err.message, "error");
				document.getElementById("escala-musicas-loading").style.display = "none";
				document.getElementById("escala-musicas-empty").style.display = "block";
				document.getElementById("escala-musicas-empty").textContent = "Erro ao carregar músicas";
			}
		}

		function renderMusicasEscala(musicas) {
			document.getElementById("escala-musicas-loading").style.display = "none";
			const tbody = document.getElementById("escala-musicas-table-body");
			if (musicas.length === 0) {
				document.getElementById("escala-musicas-table").style.display = "none";
				document.getElementById("escala-musicas-empty").style.display = "block";
				return;
			}
			document.getElementById("escala-musicas-table").style.display = "table";
			document.getElementById("escala-musicas-empty").style.display = "none";
			tbody.innerHTML = musicas.map(m => `
				<tr>
					<td>${window.saintScaleAdmin.escapeHtml(m.nome)}</td>
					<td>${window.saintScaleAdmin.escapeHtml(m.banda) || "—"}</td>
					<td>
						<div style="display:flex; align-items:center; gap:6px;">
							<input
								id="tom-input-${m.id_music_escalas}"
								type="text"
								value="${window.saintScaleAdmin.escapeHtml(m.tom || "")}"
								placeholder="${window.saintScaleAdmin.escapeHtml(m.tom_original || "original")}"
								style="width:72px; padding:4px 7px; border:1px solid var(--c8); border-radius:5px; font-size:13px; font-family:inherit;"
								onkeydown="if(event.key==='Enter'){this.blur();}"
								onblur="alterarTomMusica('${m.id_music_escalas}', this)"
							/>
							<span id="tom-status-${m.id_music_escalas}" style="font-size:11px; color:var(--c5); min-width:48px;"></span>
						</div>
					</td>
					<td>${m.ordem ?? "—"}</td>
					<td>
						<button class="btn btn-danger btn-sm" onclick="removerMusicaDeEscala(${m.id_music_escalas})">Remover</button>
					</td>
				</tr>
			`).join("");
		}

		async function alterarTomMusica(idMusicaEscala, inputEl) {
			if (!currentEscalaId) return;
			const tom = inputEl.value.trim();
			const statusEl = document.getElementById(`tom-status-${idMusicaEscala}`);
			// Nada mudou — ignora
			if (inputEl.dataset.lastSaved === tom) return;
			inputEl.disabled = true;
			if (statusEl) statusEl.textContent = "salvando…";
			try {
				await window.saintScaleAdmin.api.atualizarTomMusicaEscala(
					currentEscalaId,
					idMusicaEscala,
					tom || null,
				);
				inputEl.dataset.lastSaved = tom;
				if (statusEl) {
					statusEl.textContent = "✓ salvo";
					setTimeout(() => { statusEl.textContent = ""; }, 2000);
				}
			} catch (err) {
				if (statusEl) {
					statusEl.textContent = "✗ erro";
					statusEl.style.color = "var(--c10)";
					setTimeout(() => { statusEl.textContent = ""; statusEl.style.color = "var(--c5)"; }, 3000);
				}
				window.saintScaleAdmin.showAlert("escala-musicas-modal-alert", err.message, "error");
			} finally {
				inputEl.disabled = false;
			}
		}

		async function loadAvailableMusicas() {
			try {
				const todas = await window.saintScaleAdmin.api.listarMusicas();
				const select = document.getElementById("escala-musica-select");
				select.innerHTML = '<option value="">Selecione uma música</option>';
				todas.forEach(m => {
					const option = document.createElement("option");
					option.value = m.id;
					option.textContent = `${m.nome} (${m.artista || "—"})`;
					select.appendChild(option);
				});
			} catch (err) {
				window.saintScaleAdmin.showAlert("escala-musicas-modal-alert", err.message, "error");
			}
		}

		async function addMusicaAEscala() {
			if (!currentEscalaId) return;
			const idMusica = document.getElementById("escala-musica-select").value;
			if (!idMusica) {
				window.saintScaleAdmin.showAlert("escala-musicas-modal-alert", "Selecione uma música", "error");
				return;
			}
			const btn = document.querySelector("#escala-musicas-modal button.btn-primary");
			const originalText = btn.textContent;
			btn.textContent = "Adicionando...";
			btn.disabled = true;
			try {
				await window.saintScaleAdmin.api.adicionarMusicaEscala(currentEscalaId, Number(idMusica));
				window.saintScaleAdmin.showAlert("escala-musicas-modal-alert", "Música adicionada à escala", "success");
				document.getElementById("escala-musica-select").value = "";
				await loadMusicasEscala();
				await loadAvailableMusicas();
			} catch (err) {
				window.saintScaleAdmin.showAlert("escala-musicas-modal-alert", err.message, "error");
			} finally {
				btn.textContent = originalText;
				btn.disabled = false;
			}
		}

		async function removerMusicaDeEscala(idMusicEscalas) {
			if (!currentEscalaId) return;
			if (!confirm("Tem certeza que deseja remover esta música da escala?")) return;
			try {
				await window.saintScaleAdmin.api.removerMusicaEscala(currentEscalaId, idMusicEscalas);
				window.saintScaleAdmin.showAlert("escala-musicas-modal-alert", "Música removida da escala", "success");
				await loadMusicasEscala();
				await loadAvailableMusicas();
			} catch (err) {
				window.saintScaleAdmin.showAlert("escala-musicas-modal-alert", err.message, "error");
			}
		}

		document.getElementById("escala-form").addEventListener("submit", saveEscala);
		window.onclick = (e) => {
			if (e.target === document.getElementById("escala-modal")) closeEscalaModal();
			if (e.target === document.getElementById("escala-membros-modal")) closeMembrosModal();
			if (e.target === document.getElementById("escala-musicas-modal")) closeMusicasModal();
		};

		if (!window.saintScaleAdmin.isAuthenticated()) {
			window.location.href = "/admin/index.html";
		} else {
			loadEscalas();
		}
	</script>
</body>
</html>
